# Minimal Supabase config for Edge Functions deploy.
# Project ref is set via `supabase link` or `--project-ref`.

[functions.send-booking-email]
verify_jwt = true

# Database Webhooks call these with a shared secret header (not a user JWT).
[functions.notify-new-message]
verify_jwt = false

[functions.notify-listing-review]
verify_jwt = false

[functions.create-hold-checkout]
verify_jwt = true

# Provider (or mock checkout) posts here — signature verified in code, not JWT.
[functions.payment-webhook]
verify_jwt = false

[functions.cancel-hold]
verify_jwt = true

# Public uptime probe — rate-limited in code; uses anon key from monitors.
[functions.health]
verify_jwt = false

[functions.delete-account]
verify_jwt = true
